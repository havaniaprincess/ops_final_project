[package]
name = "https_server"
authors = ["Dmitriy Yudin a.k.a HavaniaPrincess"]
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "fs"] }
axum = "0.8"
tokio-util = { version = "0.7.20", features = ["io-util"] }
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "ops_app"
path = "src/main.rs"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
