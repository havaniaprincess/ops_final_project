[package]
name = "https_server"
author = "Dmitriy Yudin a.k.a HavaniaPrincess"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "fs"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io-util"] }

[[bin]]
name = "ops_app"
path = "src/main.rs"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
