# Название workflow отображается во вкладке Actions и в статусах PR
name: CI-rust

# Когда запускать CI
on:
  push:
    branches: [main]        # каждый коммит в main
  pull_request:             # каждый PR (и каждое новое обновление PR)

# Минимальные права для GITHUB_TOKEN: только чтение репозитория.
# Если джобе нужно больше (например, публикация релиза), выдавайте точечно.
permissions:
  contents: read

# Если в ту же ветку/PR прилетел новый коммит, отменяем устаревший запуск.
# Экономит минуты Actions и очередь раннеров.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always   # цветной вывод cargo в логах
  RUSTFLAGS: -D warnings     # любые warnings компилятора = ошибка (только в CI!)
  RUSTDOCFLAGS: -D warnings  # то же самое для rustdoc (битые ссылки в доках и т.п.)

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Складываем всё, что нужно для запуска: бинарник + статика + контрольная сумма
      - name: Prepare dist
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ops_app dist/
          cp target/release/ops_app.exe dist/
          cp -r html css js dist/
          (cd dist && sha256sum ops_app* > ops_app.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ops_app-${{ matrix.os }}-${{ github.sha }} 
          path: dist/
          if-no-files-found: error
  # ---------- Проверка форматирования ----------
  # Самая быстрая проверка: кэш и сборка не нужны
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # забираем код
      - uses: dtolnay/rust-toolchain@stable       # ставим stable Rust
        with:
          components: rustfmt                     # + компонент rustfmt
      # --check не меняет файлы, а падает, если код не отформатирован
      - run: cargo fmt --all -- --check
  # ---------- Линтер ----------
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2              # кэш ~/.cargo и target/
      # --workspace: все крейты; --all-targets: включая тесты, примеры, бенчи;
      # --all-features: со всеми фичами; --locked: строго по Cargo.lock
      - run: cargo clippy --workspace --all-targets --all-features --locked

  # ---------- Тесты ----------
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})   # имя джобы в UI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # не прерывать остальные комбинации, если одна упала
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable]
        include:
          # Дополнительная комбинация: проверка MSRV (минимальной поддерживаемой
          # версии Rust). Значение должно совпадать с rust-version в Cargo.toml.
          - os: ubuntu-latest
            toolchain: "1.99"
    steps:
      - uses: actions/checkout@v4
      # @master нужен, чтобы передавать версию тулчейна параметром
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest      # быстро ставит готовый бинарник nextest
      # nextest быстрее обычного cargo test и даёт читаемый отчёт
      - run: cargo nextest run --profile ci --workspace --all-features --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/nextest/ci/junit.xml

  # ---------- Сборка документации ----------
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-deps: только свои крейты; ошибки в доках ловятся через RUSTDOCFLAGS
      - run: cargo doc --workspace --no-deps --all-features --locked
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/doc/

  # ---------- Покрытие кода ----------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview          # нужен для llvm-cov
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Формируем отчёт в формате lcov
      - run: cargo llvm-cov --workspace --all-features --no-report
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - run: cargo llvm-cov report --html --output-dir coverage
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html/

  # ---------- Безопасность и лицензии зависимостей ----------
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny проверяет уязвимости (RustSec), лицензии, дубли и источники
      # зависимостей. Правила лежат в deny.toml в корне репозитория.
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ---------- Сводная джоба для branch protection ----------
  # В настройках ветки main достаточно требовать только эту проверку.
  # Тогда при изменении матрицы или списка джоб настройки менять не нужно.
  ci-success:
    if: always()                                  # выполнять, даже если зависимости упали
    needs: [fmt, clippy, test, docs, build]       # ждём обязательные джобы
    runs-on: ubuntu-latest
    steps:
      # Падаем, если хоть одна из джоб провалилась или была отменена
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then exit 1; fi