# CI для Python-сервиса документации (папка python/)
name: CI-python

# Python-сервис живёт в ветке python_touch — проверяем её.
# Rust-код тоже в списке: образ собирает из него документацию (cargo doc),
# поэтому сломать сборку может и изменение в src/.
on:
  push:
    branches: [python_touch]
    paths:
      - "python/**"
      - ".github/workflows/ci_python.yaml"
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  # PR в python_touch и из неё (например, в main)
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/ci_python.yaml"
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  # Ручной запуск: Actions → CI-python → Run workflow
  workflow_dispatch:

# Только чтение репозитория
permissions:
  contents: read

# Новый коммит в ту же ветку/PR отменяет устаревший запуск
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Все команды выполняются в папке python/
defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                   # кэш скачанных пакетов
          cache-dependency-path: python/requirements*.txt
      - run: pip install -r requirements.txt -r requirements_dev.txt
      # Линтер: ошибки и подозрительные места в коде
      - run: ruff check .
      # Форматирование: --check не меняет файлы, а падает, если код не отформатирован
      - run: ruff format --check .
      # Тесты (используют свою маленькую документацию, cargo doc не нужен).
      # Заодно сохраняем отчёты: результаты тестов (JUnit) и покрытие кода (XML + HTML)
      - run: >-
          pytest -v
          --junitxml=reports/junit.xml
          --cov=app --cov-report=term
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/coverage-html
      # Выгружаем отчёты даже если тесты упали — тогда они нужнее всего.
      # Путь в upload-artifact считается от корня репозитория, а не от python/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-reports
          path: python/reports/
          retention-days: 30

  # ---------- Сборка и проверка Docker-образа ----------
  docker:
    runs-on: ubuntu-latest
    # Образ собирается из корня репозитория (нужны и src/, и python/)
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f python/Dockerfile -t rust-docs .
      # Запускаем контейнер и проверяем, что сервис отвечает и документация внутри есть
      - name: Smoke test
        run: |
          docker run -d --name rust-docs -p 8000:8000 rust-docs
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:8000/ops_app/index.html
      # Логи контейнера: выводим в лог CI и сохраняем файлом (в т.ч. при падении)
      - name: Container logs
        if: always()
        run: docker logs rust-docs 2>&1 | tee container.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-docs-container-log
          path: container.log
          retention-days: 30
      # Готовый образ архивом: скачать и запустить без сборки — docker load < rust-docs-image.tar.gz
      - name: Save image
        run: docker save rust-docs | gzip > rust-docs-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rust-docs-image
          path: rust-docs-image.tar.gz
          if-no-files-found: error
          retention-days: 30
